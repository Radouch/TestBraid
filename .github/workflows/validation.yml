name: PoC-A schema and build checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Vue / Ajv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Shared schema fixtures (Ajv)
        run: npm run test:schemas
        working-directory: frontend
      - name: Question editor model and publication invariants
        run: npm run test:editor
        working-directory: frontend
      - name: Published question read-only rendering regression
        run: npm run test:published
        working-directory: frontend
      - name: Pure learner scoring and answer state regression
        run: npm run test:learner
        working-directory: frontend
      - name: Continuous learner page interaction regression
        run: npm run test:runner
        working-directory: frontend
      - name: Shared author editor and lesson dialogs regression
        run: npm run test:author
        working-directory: frontend
      - name: Question composition and private media interaction regression
        run: npm run test:content
        working-directory: frontend
      - name: FilePond multipart upload and answer attachment regression
        run: npm run test:upload
        working-directory: frontend
      - name: Navigation and UI language URL regression
        run: npm run test:navigation
        working-directory: frontend
      - name: Runtime deployment URL base regression
        run: npm run test:base
        working-directory: frontend
      - name: Multilingual installation branding regression
        run: npm run test:branding
        working-directory: frontend
      - name: Runtime translation loading and locale allowlist
        run: npm run test:locales
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      # Exercise the same staging layout used for the owner's SFTP deployment.
      - name: Stage deployment and verify private schemas
        run: |
          node scripts/prepare-deployment.mjs
          test -f deployment-package/testbraid-backend/schemas/test.schema.json
          test -f deployment-package/testbraid-backend/schemas/fixtures/manifest.json
          test -f deployment-package/testbraid-backend/composer.lock
          test -f deployment-package/www/api/index.php
          test -f deployment-package/www/index.php
          test -f deployment-package/testbraid-backend/templates/index.html
          test ! -f deployment-package/www/index.html
          test -f deployment-package/www/locales/en.json
          test -f deployment-package/www/locales/cs.json
          test -f deployment-package/testbraid-backend/.htaccess
          test ! -e deployment-package/testbraid-backend/config
          test ! -e deployment-package/testbraid-backend/config/authors.json
          test ! -e deployment-package/testbraid-backend/vendor
      - name: Audit upgrade-safe SFTP deployment package
        run: node scripts/verify-deployment-package.mjs
      - name: Stage and audit a fresh installation with default config
        run: |
          node scripts/prepare-deployment.mjs --initial-install
          test -f deployment-package/testbraid-backend/config/app.json
          test ! -e deployment-package/testbraid-backend/config/authors.json
          cmp backend/config/app.json deployment-package/testbraid-backend/config/app.json
          node scripts/verify-deployment-package.mjs

  backend:
    name: PHP / Opis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      # Composer is installed on CI/hosting, never required on a developer laptop.
      - name: Validate locked Composer metadata
        run: composer validate --no-check-publish
        working-directory: backend
      - name: Install backend dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
        working-directory: backend
      - name: Lint PHP
        run: |
          composer run lint
          php -l ../deploy/www/index.php
          php -l ../deploy/www/api/index.php
        working-directory: backend
      - name: Shared schema fixtures (Opis)
        run: composer run test:schemas
        working-directory: backend
      # Uses an isolated loopback PHP server and disposable credentials.
      - name: Runtime base path validation and private-root regression
        run: php bin/test-subdirectory-config.php
        working-directory: backend
      - name: Installation UI language configuration validation
        run: composer run test:ui-languages
        working-directory: backend
      - name: HTTP authentication smoke test
        run: composer run test:auth
        working-directory: backend
      - name: First-author browser setup smoke test
        run: bash bin/test-first-author-setup.sh
        working-directory: backend
      - name: JSON storage atomicity and path checks
        run: composer run test:storage
        working-directory: backend
      - name: Shared-host public-root isolation regression
        run: composer run test:storage-roots
        working-directory: backend
      - name: Protected JSON persistence HTTP integration
        run: composer run test:storage-http
        working-directory: backend
      - name: Authenticated media upload and range HTTP integration
        run: composer run test:media-http
        working-directory: backend
      - name: Publication lifecycle and static media HTTP integration
        run: composer run test:publication-http
        working-directory: backend
      - name: Failed publication rollback and orphan reconciliation
        run: composer run test:publication-failures
        working-directory: backend
