# One-time bridge to create v0.7.2 and dispatch the standard release workflow.
# Remove this file after release verification. Future tags use the regular workflow.
name: Create v0.7.2 tag and start release

on:
  push:
    branches:
      - main
    paths:
      - frontend/package.json

permissions:
  contents: write
  actions: write

jobs:
  start:
    if: github.repository == 'Radouch/TestBraid'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact release version
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./frontend/package.json').version")" = "0.7.2"
      - name: Create tag and dispatch standard release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # A GITHUB_TOKEN-created tag does not trigger push workflows; explicit
          # workflow_dispatch starts the existing validated packaging pipeline.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref=refs/tags/v0.7.2 -f sha="$GITHUB_SHA" > /dev/null
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" \
            -f ref=v0.7.2
